name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate tag, versions and release notes
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/published-releases.json"
          export PUBLISHED_RELEASES="$RUNNER_TEMP/published-releases.json"
          bun scripts/release.ts validate "$RELEASE_TAG"
      - name: Check package maintainer
        env:
          PACKAGE_MAINTAINER: ${{ vars.PACKAGE_MAINTAINER }}
        run: ': "${PACKAGE_MAINTAINER:?set PACKAGE_MAINTAINER to a name and email}"'
      - name: Check stable release configuration
        if: steps.release.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          : "${HOMEBREW_TAP:?set HOMEBREW_TAP to owner/repo}"
          : "${GH_TOKEN:?set HOMEBREW_TAP_TOKEN with write access to the tap}"
          gh api "repos/${HOMEBREW_TAP}" --jq .default_branch

  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bun test scripts/release.test.ts scripts/soclib.test.ts

  native:
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            package_arch: arm7
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            package_arch: arm64
          - target: i686-unknown-linux-musl
            os: ubuntu-24.04
            package_arch: '386'
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            package_arch: amd64
          # Windows waits for native authentication and terminal validation.
          # - target: i686-pc-windows-msvc
          #   os: windows-2025
          # - target: x86_64-pc-windows-msvc
          #   os: windows-2025
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      PACKAGE_MAINTAINER: ${{ vars.PACKAGE_MAINTAINER }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Rust
        run: rustup show active-toolchain && rustup target add "$TARGET"
      - name: Install cross and nFPM
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools/cross" "$RUNNER_TEMP/release-tools/nfpm"
          gh release download v0.2.5 --repo cross-rs/cross --pattern cross-x86_64-unknown-linux-musl.tar.gz --pattern checksums.txt --dir "$RUNNER_TEMP/release-tools/cross"
          (builtin cd "$RUNNER_TEMP/release-tools/cross" && sha256sum --check --ignore-missing checksums.txt && tar -xzf cross-x86_64-unknown-linux-musl.tar.gz)
          gh release download v2.48.0 --repo goreleaser/nfpm --pattern nfpm_2.48.0_Linux_x86_64.tar.gz --dir "$RUNNER_TEMP/release-tools/nfpm"
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/release-tools/nfpm/nfpm_2.48.0_Linux_x86_64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/release-tools/nfpm/nfpm_2.48.0_Linux_x86_64.tar.gz" -C "$RUNNER_TEMP/release-tools/nfpm"
          echo "$RUNNER_TEMP/release-tools/cross" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/release-tools/nfpm" >> "$GITHUB_PATH"
      - name: Build and smoke test Linux
        if: runner.os == 'Linux'
        run: |
          cross build --locked --release --bin socli --target "$TARGET"
          cross run --locked --release --bin socli --target "$TARGET" -- --version | grep -Fx "socli $VERSION"
      - name: Build and smoke test macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --bin socli --target "$TARGET"
          "target/$TARGET/release/socli" --version | grep -Fx "socli $VERSION"
      - name: Package native build
        run: bash scripts/package-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  web:
    needs: [validate, test]
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  github-release:
    needs: [validate, native, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          NPM_CLI_PACKAGE_NAME: ${{ vars.NPM_CLI_PACKAGE_NAME }}
        run: |
          bun scripts/release.ts validate "$RELEASE_TAG"
          bun scripts/release.ts npm-native artifacts release/npm-native
          for package in release/npm-native/*; do
            npm pack "./$package" --pack-destination artifacts
          done
          bun scripts/release.ts formula "$VERSION" "$GITHUB_REPOSITORY" artifacts
          bun scripts/release.ts checksums artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: artifacts/*
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release/existing.json 2>/dev/null; then
            jq -e '.isDraft == true' release/existing.json
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --draft --verify-tag --title "$RELEASE_TAG" --notes-file release/notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$([[ "$PRERELEASE" == false ]] && echo true || echo false)"

  npm:
    needs: [validate, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: artifacts
      - name: Publish platform binaries, browser engine and CLI launcher
        env:
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          (builtin cd artifacts && sha256sum --check SHA256SUMS)
          bun scripts/publish-npm.ts artifacts

  homebrew:
    needs: [validate, github-release, npm]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: artifacts
      - name: Update tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          (builtin cd artifacts && sha256sum --check SHA256SUMS)
          bash scripts/update-homebrew.sh

  deploy-pages:
    needs: [validate, homebrew]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
